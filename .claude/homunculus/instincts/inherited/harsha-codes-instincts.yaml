# Harsha Codes Workflow Update Section Components And Layout

## Action

Follow the update-section-components-and-layout workflow:
1. Edit one or more files in web/src/components/sections/ (such as experience.tsx, contact.tsx, tech.tsx, etc.)
2. Update shared layout components in web/src/components/layout/ (such as section.tsx, site-footer.tsx)
3. Optionally update supporting files (e.g., web/src/lib/tech-icons.ts, web/src/content/portfolio.ts)
4. Test changes in the browser or with unit tests

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: web/src/components/sections/*.tsx, web/src/components/layout/*.tsx

